name: Publish encrypted Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: protected-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare encrypted artifact
        run: |
          mkdir -p "$RUNNER_TEMP/protected-site"
          cp -R index.html 404.html sw.js robots.txt .nojekyll __gate "$RUNNER_TEMP/protected-site/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/protected-site
      - name: Deploy encrypted site
        id: deployment
        uses: actions/deploy-pages@v4
